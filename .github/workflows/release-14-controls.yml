permissions:
  contents: read

jobs:
  # Current-state documentation must agree with release/current.json, the
  # record of the latest published release. Needs only the standard library.
  docs-release-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Documentation and release media agree
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 tests/docs-release-sync.py -v
      - name: One release version
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 tests/version-sync.py -v
      - name: Package mirror plan
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 tests/package-mirror-plan.py -v
      - name: Installer trace
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 tests/install-trace.py -v
      - name: GPU report
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 tests/gpu-report.py -v
      - name: Build timing record
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 tests/build-timing-record.py -v
      - name: Login trace
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 tests/login-trace.py -v
      - name: Visual SDK
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -I tests/visual-sdk.py -v
      - name: Plugin runtime and installer games
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 scripts/seal-games.py --check
          python3 -I tests/plugins-and-games.py -v
          python3 -I tests/sdk-windows.py -v
          python3 -I tests/extension-bundles.py -v
          python3 -I tests/installer-extensions.py -v
          python3 -I tests/installer-sdk-audit.py -v
          python3 -I tests/installer-progress-stats.py -v
      - name: Parallel package fetch
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 tests/parallel-fetch.py -v
      - name: Closure feed gate
        run: sh tests/closure-feed-check.sh
      - name: Package feed staging
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 tests/package-feed-stage.py -v
      - name: Package feed upload and verification
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 tests/package-feed-upload.py -v
      - name: Install baselines and comparison
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 tests/install-trace-baseline.py -v

  controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # LitAI 1.4.0, the framework the Standard lifecycle binding selects.
      # Rebuilding changes ZIP timestamps, and *.dist-info records the build
      # tool's version, so verify the 1,234 package members rather than the
      # archive hash; the pinned Git tree covers the source.
      - uses: actions/checkout@v4
        with:
          repository: jordanhubbard/literate-ai
          ref: 0a267a6646f20e3a635a1f870042b6b034f026a1
          path: _framework_src
          persist-credentials: false
      - name: Verify and install the selected framework runtime
        run: |
          test "$(git -C _framework_src rev-parse HEAD)" = 0a267a6646f20e3a635a1f870042b6b034f026a1
          test "$(git -C _framework_src rev-parse HEAD^{tree})" = cada37a12b930b109b298e0ed5c4f7dc24e5a467
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/framework-wheels" ./_framework_src
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import zipfile

          wheels = list(Path(os.environ['RUNNER_TEMP'], 'framework-wheels').glob('literate_ai-1.4.0-*.whl'))
          if len(wheels) != 1:
              raise SystemExit(f'expected one pinned framework wheel, found {len(wheels)}')
          with zipfile.ZipFile(wheels[0]) as wheel:
              rows = sorted((name, hashlib.sha256(wheel.read(name)).hexdigest())
                            for name in wheel.namelist()
                            if not name.endswith('/') and '.dist-info/' not in name)
          digest = hashlib.sha256(json.dumps(rows, separators=(',', ':')).encode()).hexdigest()
          expected = '7a37c208a61bf38165ce06b9cae0eccafc1ee507dc658f469afda8e92111c0a4'
          if len(rows) != 1234 or digest != expected:
              for name, value in rows:
                  print('member', value, name)
              raise SystemExit(f'framework payload manifest mismatch: {len(rows)} entries, {digest}')
          print(f'framework payload verified: {len(rows)} entries, sha256:{digest}')
          PY
          python -m pip install "$RUNNER_TEMP"/framework-wheels/literate_ai-1.4.0-*.whl
      - name: Focused release graph, cache, measurement and QA checks
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -c 'import literate_ai, sys; print(literate_ai.__file__, sys.version)'
          for test in \
            tests/release-input-graph.py \
            tests/package-reuse-inventory.py \
            tests/release-measurements.py \
            tests/installer-measurements.py \
            tests/installer-baseline-context.py \
            tests/release-qa-plan.py \
            tests/verified-artifact-cache.py \
            tests/signed-package-snapshot.py \
            tests/recover-retained-package-inventory.py; do
            if test -f "$test"; then
              python3 "$test" -v
            fi
          done
          bash -n overlay/usr/local/libexec/daemonarchy-installer/install
          sh -n overlay/usr/local/libexec/daemonarchy-installer/package-repository
          sh -n test-bhyve.sh
