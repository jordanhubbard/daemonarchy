name: Release 1.4 controller checks

on:
  push:
    paths:
      - '.github/workflows/release-14-controls.yml'
      - 'scripts/release-input-graph.py'
      - 'tests/release-input-graph.py'
      - 'native/release-graph/**'
      - 'scripts/package-reuse-inventory.py'
      - 'tests/package-reuse-inventory.py'
      - 'scripts/release-measurements.py'
      - 'tests/release-measurements.py'
      - 'scripts/release-qa-plan.py'
      - 'tests/release-qa-plan.py'
      - 'scripts/verified-artifact-cache.py'
      - 'tests/verified-artifact-cache.py'
      - 'scripts/signed-package-snapshot.py'
      - 'tests/signed-package-snapshot.py'
      - 'overlay/usr/local/libexec/daemonarchy-installer/install'
      - 'overlay/usr/local/libexec/daemonarchy-installer/package-repository'
      - 'test-bhyve.sh'
  pull_request:
    paths:
      - '.github/workflows/release-14-controls.yml'
      - 'scripts/release-input-graph.py'
      - 'tests/release-input-graph.py'
      - 'native/release-graph/**'
      - 'scripts/package-reuse-inventory.py'
      - 'tests/package-reuse-inventory.py'
      - 'scripts/release-measurements.py'
      - 'tests/release-measurements.py'
      - 'scripts/release-qa-plan.py'
      - 'tests/release-qa-plan.py'
      - 'scripts/verified-artifact-cache.py'
      - 'tests/verified-artifact-cache.py'
      - 'scripts/signed-package-snapshot.py'
      - 'tests/signed-package-snapshot.py'
      - 'overlay/usr/local/libexec/daemonarchy-installer/install'
      - 'overlay/usr/local/libexec/daemonarchy-installer/package-repository'
      - 'test-bhyve.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # This is the retained 1.3.1-capable framework API selected by the
      # release work, not the hosted runner's ambient literate-ai version.
      - uses: actions/checkout@v4
        with:
          repository: jordanhubbard/literate-ai
          ref: c345e652b91863e72526f25f8e31a03ec34bec01
          path: _framework_src
          persist-credentials: false
      - name: Verify and install the selected framework runtime
        run: |
          test "$(git -C _framework_src rev-parse HEAD)" = c345e652b91863e72526f25f8e31a03ec34bec01
          test "$(git -C _framework_src rev-parse HEAD^{tree})" = f2c58cb23d316374a3b4c3b38d9c1b7b3bac57a4
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/framework-wheels" ./_framework_src
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import zipfile

          wheels = list(Path(os.environ['RUNNER_TEMP'], 'framework-wheels').glob('literate_ai-1.3.0-*.whl'))
          if len(wheels) != 1:
              raise SystemExit(f'expected one pinned framework wheel, found {len(wheels)}')
          with zipfile.ZipFile(wheels[0]) as wheel:
              rows = sorted((name, hashlib.sha256(wheel.read(name)).hexdigest())
                            for name in wheel.namelist() if not name.endswith('/'))
          digest = hashlib.sha256(json.dumps(rows, separators=(',', ':')).encode()).hexdigest()
          expected = '126f5d4f5988e50e151161ee2235ca6a82652f96c3eb559e780f5acf4cb5aacb'
          if len(rows) != 1239 or digest != expected:
              raise SystemExit(f'framework payload manifest mismatch: {len(rows)} entries, {digest}')
          print(f'framework payload verified: {len(rows)} entries, sha256:{digest}')
          PY
          python -m pip install "$RUNNER_TEMP"/framework-wheels/literate_ai-1.3.0-*.whl
      - name: Focused release graph, cache, measurement and QA checks
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          for test in \
            tests/release-input-graph.py \
            tests/package-reuse-inventory.py \
            tests/release-measurements.py \
            tests/release-qa-plan.py \
            tests/verified-artifact-cache.py \
            tests/signed-package-snapshot.py; do
            if test -f "$test"; then
              python3 "$test" -v
            fi
          done
          bash -n overlay/usr/local/libexec/daemonarchy-installer/install
          sh -n overlay/usr/local/libexec/daemonarchy-installer/package-repository
          sh -n test-bhyve.sh
