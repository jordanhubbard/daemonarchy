permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Discovery refusal and pinned-object tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 tests/native-tree-discovery.py -v
          python3 tests/native-dirdeps.py -v
          python3 tests/native-workspace.py -v
          python3 tests/qemu-worker.py -v
          python3 tests/package-dag.py -v
          python3 tests/native-package-plan.py -v
          python3 tests/signed-package-snapshot.py -v
      - name: Isolated ISO staging controls
        run: |
          sh -n build-iso.sh scripts/iso-stage.sh
          python3 tests/iso-stage.py -v
          python3 tests/test-loader.py -v
      - name: Per-architecture image and installer controls
        run: |
          sh -n scripts/image-architecture.sh scripts/make-efi-iso.sh scripts/check-gpu-packages.sh pkg-repo.sh
          bash -n overlay/usr/local/libexec/daemonarchy-installer/disk-layout overlay/usr/local/libexec/daemonarchy-installer/gpu-config
          sh tests/package-repository.sh
          bash tests/image-architecture.sh
          python3 tests/install-trace-media.py -v
          python3 tests/normal-boot-trace.py -v
          python3 tests/boot-medium.py
          python3 tests/boot-medium-gpt.py -v
          python3 tests/boot-medium-fat.py -v
          python3 tests/boot-medium-native.py -v
          python3 tests/boot-medium-capture.py -v
          python3 tests/session-log.py -v
          sh -n scripts/make-ram-iso.sh
          python3 tests/live-root-metadata.py -v
          python3 tests/ram-live-image.py -v
          python3 tests/live-trace-stage.py -v
          sh -n tools/boottrace/daemonarchy_trace overlay/usr/local/libexec/daemonarchy-installer/boot-trace
      - name: Measured installer progress and completion controls
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          bash -n overlay/usr/local/libexec/daemonarchy-installer/dashboard overlay/usr/local/libexec/daemonarchy-installer/install
          bash -n overlay/usr/local/libexec/daemonarchy-installer/install-screen overlay/usr/local/libexec/daemonarchy-installer/remote-debug overlay/usr/local/libexec/daemonarchy-installer/install-failed
          python3 -m py_compile overlay/usr/local/libexec/daemonarchy-installer/progress-model.py overlay/usr/local/libexec/daemonarchy-installer/sound.py overlay/usr/local/libexec/daemonarchy-installer/charm.py scripts/installer-visuals-demo.py scripts/scrub-install-log.py
          bash -n overlay/usr/local/libexec/daemonarchy-installer/sound-setup overlay/usr/local/libexec/daemonarchy-installer/configurator overlay/usr/local/libexec/daemonarchy-installer/launch
          sh -n overlay/usr/local/libexec/daemonarchy-installer/sound overlay/usr/local/libexec/daemonarchy-installer/charm overlay/usr/local/share/daemonarchy-installer/greeting/daemonarchy_greeting
          for view in install-views pkg-events; do python3 -c 'import ast, sys; ast.parse(open(sys.argv[1]).read())' "overlay/usr/local/libexec/daemonarchy-installer/$view"; done
          command -v tmux >/dev/null || sudo apt-get install -y tmux
          python3 tests/installer-progress.py
          bash tests/installer-charm.sh
          bash tests/install-failed.sh
          bash tests/clock-floor.sh
          bash tests/install-integrity.sh
      - name: Live desktop controls (LIVE-001)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q lua5.4
          lib=overlay/usr/local/libexec/daemonarchy-installer
          bash -n "$lib/live-gpu" "$lib/live-session" "$lib/live-backend" "$lib/launch" "$lib/configurator"
          sh -n "$lib/live-service" "$lib/live-desktop" live-post.sh scripts/check-image-size.sh tests/live-image-runtime.sh
          python3 -c 'import sys; compile(open(sys.argv[1]).read(), sys.argv[1], "exec")' "$lib/live-installer"
          bash tests/live-desktop.sh
          bash tests/live-backend.sh
          bash tests/secureboot-options.sh
          python3 tests/live-installer.py -v
          lua5.4 tests/loader-live-menu.lua
      - name: Hardware trace image network hand-over
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          sudo apt-get install -y -q gdisk dosfstools mtools
          sh -n build-hwtrace-image.sh tools/hwtrace/rc tools/hwtrace/net.sh
          sh tests/hwtrace-net.sh
          sh tests/hwtrace-capture.sh
          python3 tests/hwtrace-pi4-simulator.py -v
          python3 tests/hwtrace-pi4-network.py -v
          python3 tests/hwtrace-pi4-usb-network.py -v
          python3 tests/hwtrace-pi4-uefi-simulator.py -v
          python3 tests/pi5-bootstrap.py -v
          python3 tests/boottrace-tools.py -v
      - name: Offline MacBook firmware sources and image size budgets
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          bash -n overlay/usr/local/libexec/daemonarchy-installer/apple-firmware overlay/usr/local/libexec/daemonarchy-installer/configurator
          python3 tests/apple-firmware-offline.py -v
          bash tests/apple-firmware-offline.sh
          bash tests/live-image-budget.sh
      - name: Installer network bring-up (NET-001) and installed boot networking (NET-002)
        run: |
          bash -n overlay/usr/local/libexec/daemonarchy-installer/network-bringup overlay/usr/local/libexec/daemonarchy-installer/launch
          bash tests/network-bringup.sh
          bash tests/installed-boot-network.sh
          bash tests/network-diagnostics.sh
          bash tests/installer-wifi-timing.sh
          bash tests/enterprise-wifi-options.sh
          bash tests/remote-debug-network.sh
      - name: Release gate refuses missing evidence
        run: |
          python3 -m json.tool literate.release.json >/dev/null
          python3 -m py_compile scripts/release-check-1.3.1.py
          python3 tests/release-native-evidence.py -v
          python3 tests/release-asset-names.py -v
          if python3 scripts/release-check-1.3.1.py >release-gate.log 2>&1; then
            echo 'Release gate accepted absent evidence' >&2
            exit 1
          fi
          grep -q 'set DAEMONARCHY_RELEASE_RECORD' release-gate.log
