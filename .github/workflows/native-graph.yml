name: Native tree discovery checks

on:
  push:
    paths:
      - 'scripts/package-dag.py'
      - 'tests/package-dag.py'
      - 'scripts/native-package-plan.py'
      - 'tests/native-package-plan.py'
      - 'scripts/signed-package-snapshot.py'
      - 'tests/signed-package-snapshot.py'
      - 'scripts/inspect-freebsd-graph.py'
      - 'tests/native-tree-discovery.py'
      - 'scripts/resolve-freebsd-dirdeps.py'
      - 'tests/native-dirdeps.py'
      - 'scripts/native-workspace.py'
      - 'tests/native-workspace.py'
      - 'native/workspace.json'
      - 'native/worker-template.json'
      - 'native/qemu-worker.py'
      - 'native/inspect-worker-allocation.py'
      - 'tests/qemu-worker.py'
      - 'build-iso.sh'
      - 'scripts/iso-stage.sh'
      - 'tests/iso-stage.py'
      - 'scripts/test-loader.py'
      - 'tests/test-loader.py'
      - 'live-post.sh'
      - 'overlay/usr/local/libexec/daemonarchy-installer/progress-dashboard.py'
      - 'overlay/usr/local/libexec/daemonarchy-installer/dashboard'
      - 'overlay/usr/local/libexec/daemonarchy-installer/install'
      - 'overlay/usr/local/libexec/daemonarchy-installer/install-integrity'
      - 'tests/installer-progress.py'
      - 'tests/install-integrity.sh'
      - 'tests/fixtures/installer-progress/**'
      - 'literate.release.json'
      - 'scripts/release-check-1.3.1.py'
      - 'tests/release-native-evidence.py'
      - 'scripts/verify-release-assets.py'
      - 'tests/release-asset-names.py'
      - 'scripts/import-apple-bcm4364-firmware.py'
      - 'overlay/usr/local/libexec/daemonarchy-installer/apple-firmware'
      - 'overlay/usr/local/libexec/daemonarchy-installer/configurator'
      - 'tests/apple-firmware-offline.py'
      - 'tests/apple-firmware-offline.sh'
      - 'scripts/check-image-size.sh'
      - 'scripts/live-image-excludes'
      - 'tests/live-image-budget.sh'
      - '.github/workflows/native-graph.yml'
  pull_request:
    paths:
      - 'scripts/package-dag.py'
      - 'tests/package-dag.py'
      - 'scripts/native-package-plan.py'
      - 'tests/native-package-plan.py'
      - 'scripts/signed-package-snapshot.py'
      - 'tests/signed-package-snapshot.py'
      - 'scripts/inspect-freebsd-graph.py'
      - 'tests/native-tree-discovery.py'
      - 'scripts/resolve-freebsd-dirdeps.py'
      - 'tests/native-dirdeps.py'
      - 'scripts/native-workspace.py'
      - 'tests/native-workspace.py'
      - 'native/workspace.json'
      - 'native/worker-template.json'
      - 'native/qemu-worker.py'
      - 'native/inspect-worker-allocation.py'
      - 'tests/qemu-worker.py'
      - 'build-iso.sh'
      - 'scripts/iso-stage.sh'
      - 'tests/iso-stage.py'
      - 'scripts/test-loader.py'
      - 'tests/test-loader.py'
      - 'live-post.sh'
      - 'overlay/usr/local/libexec/daemonarchy-installer/progress-dashboard.py'
      - 'overlay/usr/local/libexec/daemonarchy-installer/dashboard'
      - 'overlay/usr/local/libexec/daemonarchy-installer/install'
      - 'overlay/usr/local/libexec/daemonarchy-installer/install-integrity'
      - 'tests/installer-progress.py'
      - 'tests/install-integrity.sh'
      - 'tests/fixtures/installer-progress/**'
      - 'literate.release.json'
      - 'scripts/release-check-1.3.1.py'
      - 'tests/release-native-evidence.py'
      - 'scripts/verify-release-assets.py'
      - 'tests/release-asset-names.py'
      - 'scripts/import-apple-bcm4364-firmware.py'
      - 'overlay/usr/local/libexec/daemonarchy-installer/apple-firmware'
      - 'overlay/usr/local/libexec/daemonarchy-installer/configurator'
      - 'tests/apple-firmware-offline.py'
      - 'tests/apple-firmware-offline.sh'
      - 'scripts/check-image-size.sh'
      - 'scripts/live-image-excludes'
      - 'tests/live-image-budget.sh'
      - '.github/workflows/native-graph.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Discovery refusal and pinned-object tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 tests/native-tree-discovery.py -v
          python3 tests/native-dirdeps.py -v
          python3 tests/native-workspace.py -v
          python3 tests/qemu-worker.py -v
          python3 tests/package-dag.py -v
          python3 tests/native-package-plan.py -v
          python3 tests/signed-package-snapshot.py -v
      - name: Isolated ISO staging controls
        run: |
          sh -n build-iso.sh scripts/iso-stage.sh
          python3 tests/iso-stage.py -v
          python3 tests/test-loader.py -v
      - name: Measured installer progress and completion controls
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          bash -n overlay/usr/local/libexec/daemonarchy-installer/dashboard overlay/usr/local/libexec/daemonarchy-installer/install
          python3 tests/installer-progress.py
          bash tests/install-integrity.sh
      - name: Offline MacBook firmware sources and image size budgets
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          bash -n overlay/usr/local/libexec/daemonarchy-installer/apple-firmware overlay/usr/local/libexec/daemonarchy-installer/configurator
          python3 tests/apple-firmware-offline.py -v
          bash tests/apple-firmware-offline.sh
          bash tests/live-image-budget.sh
      - name: Release gate refuses missing evidence
        run: |
          python3 -m json.tool literate.release.json >/dev/null
          python3 -m py_compile scripts/release-check-1.3.1.py
          python3 tests/release-native-evidence.py -v
          python3 tests/release-asset-names.py -v
          if python3 scripts/release-check-1.3.1.py >release-gate.log 2>&1; then
            echo 'Release gate accepted absent evidence' >&2
            exit 1
          fi
          grep -q 'set DAEMONARCHY_RELEASE_RECORD' release-gate.log
