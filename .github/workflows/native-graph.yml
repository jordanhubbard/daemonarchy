name: Native tree discovery checks

on:
  push:
    paths:
      - 'scripts/inspect-freebsd-graph.py'
      - 'tests/native-tree-discovery.py'
      - 'scripts/resolve-freebsd-dirdeps.py'
      - 'tests/native-dirdeps.py'
      - '.github/workflows/native-graph.yml'
  pull_request:
    paths:
      - 'scripts/inspect-freebsd-graph.py'
      - 'tests/native-tree-discovery.py'
      - 'scripts/resolve-freebsd-dirdeps.py'
      - 'tests/native-dirdeps.py'
      - '.github/workflows/native-graph.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Discovery refusal and pinned-object tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 tests/native-tree-discovery.py -v
          python3 tests/native-dirdeps.py -v
