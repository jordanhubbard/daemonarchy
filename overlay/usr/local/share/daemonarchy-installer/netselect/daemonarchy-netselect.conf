# Daemonarchy (NET-002): when a link drops, let daemonarchy-netselect move the
# default route and DNS to the next usable interface. Link-up needs no rule:
# dhclient(8) renews on its own and reports through dhclient-exit-hooks.
notify 10 {
	match "system"		"IFNET";
	match "type"		"LINK_DOWN";
	action "/usr/local/libexec/daemonarchy-netselect link-down $subsystem";
};
