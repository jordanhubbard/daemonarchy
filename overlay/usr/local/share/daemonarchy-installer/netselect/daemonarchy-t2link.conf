# Daemonarchy (NET-001, NET-002): the Apple T2 controller's internal USB link,
# cdce(4) on USB 05ac:8233, is bridgeOS and not a network. Once its ueN
# interface exists, make it IPv6 link-local only (for the Touch ID bridge),
# with no IPv4 and no dhclient. rc.conf.d/network/daemonarchy-t2link keeps
# rc.d/netif and the LINK_UP dhclient rule away from it as well.
attach 100 {
	device-name	"cdce[0-9]+";
	match "vendor"	"0x05ac";
	match "product"	"0x8233";
	action "/usr/local/libexec/daemonarchy-t2link attach $device-name";
};
