# Daemonarchy (NET-001, NET-002): installed as
# /usr/local/etc/rc.conf.d/network/daemonarchy-t2link and sourced whenever an
# rc script loads the network configuration (rc.d/netif, rc.d/dhclient,
# pccard_ether). For the Apple T2 controller's internal USB link (cdce(4) on
# USB 05ac:8233, whatever its ueN number) it sets
#   ifconfig_ueN="up"
#   ifconfig_ueN_ipv6="inet6 -ifdisabled auto_linklocal"
# so ifconfig_DEFAULT="DHCP" never starts dhclient there and the link carries
# IPv6 link-local only. Removing this file restores ordinary DHCP on it.
if [ -x /usr/local/libexec/daemonarchy-t2link ]; then
	eval "$(/usr/local/libexec/daemonarchy-t2link rc-vars 2>/dev/null)"
fi
