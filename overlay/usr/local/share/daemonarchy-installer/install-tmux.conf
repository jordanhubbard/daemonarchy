# The installer's tmux session (started by daemonarchy-installer/install-screen).
#
# tmux's own model and default keys with the Ctrl-b prefix: window 0 is the
# install progress and cannot be closed while installing; splits and new
# windows show the install log, diagnostics, remote debugging or a shell.
# No function key or virtual console switch is needed for anything here.
# Closing panes or windows never affects the installation, which runs outside
# this session. Bindings carry notes, so C-b ? lists exactly these keys.

set -g prefix C-b
set -g base-index 0
set -g escape-time 50
set -g history-limit 50000
set -g mouse off
set -g set-titles off
set -g allow-rename off
set -g automatic-rename off
set -g focus-events off
set -g display-time 3000
set -g default-command "$DAEMONARCHY_PYTHON $DAEMONARCHY_LIBEXEC/install-views shell"

set -g status on
set -g status-position bottom
set -g status-interval 2
set -g status-style "bg=colour236,fg=colour250"
set -g status-left-length 20
set -g status-left "#[bg=colour129,fg=colour231,bold] DAEMONARCHY #[default] "
set -g status-right-length 60
set -g status-right "#[fg=colour214]#{?client_prefix,PREFIX ,}#[default]C-b ? help  C-b c window  C-b % split "
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[bg=colour45,fg=colour16,bold] #I:#W* #[default]"
set -g pane-border-style "fg=colour240"
set -g pane-active-border-style "fg=colour45"
set -g message-style "bg=colour214,fg=colour16"
set -g mode-style "bg=colour45,fg=colour16"

# Only the bindings below exist under the prefix.
unbind -a -T prefix
bind -N "Send C-b to the pane" C-b send-prefix
# Terminals too small to split are zoom-only: the new pane opens as a
# full-screen window instead, and C-b 0 returns to the progress view.
bind -N "Split left/right (choose what the new pane shows)" % if -F "#{||:#{e|<|:#{window_width},80},#{e|<|:#{window_height},16}}" "new-window '$DAEMONARCHY_PYTHON $DAEMONARCHY_LIBEXEC/install-views chooser' ; display-message 'Small terminal: opened full screen (C-b 0 returns to progress)'" "split-window -h '$DAEMONARCHY_PYTHON $DAEMONARCHY_LIBEXEC/install-views chooser'"
bind -N "Split top/bottom (choose what the new pane shows)" '"' if -F "#{||:#{e|<|:#{window_width},40},#{e|<|:#{window_height},24}}" "new-window '$DAEMONARCHY_PYTHON $DAEMONARCHY_LIBEXEC/install-views chooser' ; display-message 'Small terminal: opened full screen (C-b 0 returns to progress)'" "split-window -v '$DAEMONARCHY_PYTHON $DAEMONARCHY_LIBEXEC/install-views chooser'"
bind -N "Move to the next pane" o select-pane -t :.+
bind -N "Move to the pane above" Up select-pane -U
bind -N "Move to the pane below" Down select-pane -D
bind -N "Move to the pane on the left" Left select-pane -L
bind -N "Move to the pane on the right" Right select-pane -R
bind -N "Close the pane (asks y/n; the progress view stays)" x if -F "#{==:#{pane_id},#{@progress}}" "display-message 'The progress view stays open while installing.'" "confirm-before -p 'kill-pane #P? (y/n)' kill-pane"
bind -N "Zoom or unzoom the pane" z resize-pane -Z
bind -N "New window (choose what it shows)" c new-window "$DAEMONARCHY_PYTHON $DAEMONARCHY_LIBEXEC/install-views chooser"
bind -N "Next window" n next-window
bind -N "Previous window" p previous-window
bind -N "Select window 0 (progress)" 0 select-window -t :=0
bind -N "Select window 1" 1 select-window -t :=1
bind -N "Select window 2" 2 select-window -t :=2
bind -N "Select window 3" 3 select-window -t :=3
bind -N "Select window 4" 4 select-window -t :=4
bind -N "Select window 5" 5 select-window -t :=5
bind -N "Select window 6" 6 select-window -t :=6
bind -N "Select window 7" 7 select-window -t :=7
bind -N "Select window 8" 8 select-window -t :=8
bind -N "Select window 9" 9 select-window -t :=9
bind -N "Close the window (asks y/n; window 0 stays)" & if -F "#{==:#{window_index},0}" "display-message 'Window 0 shows the installation and stays open.'" "confirm-before -p 'kill-window #W? (y/n)' kill-window"
bind -N "Window list" w run-shell -b "$DAEMONARCHY_PYTHON $DAEMONARCHY_LIBEXEC/install-views window-menu"
bind -N "Scroll/copy mode (q leaves)" [ copy-mode
bind -N "Scroll back a page" PPage copy-mode -u
bind -N "List these keys" ? list-keys -N -T prefix
bind -N "Detach is not available in the installer" d display-message "Detach is not available in the installer; the installation keeps running."
bind -N "Open the install log in a new window" G new-window -n log "$DAEMONARCHY_PYTHON $DAEMONARCHY_LIBEXEC/install-views log"
bind -N "Open diagnostics in a new window" H new-window -n diagnostics "$DAEMONARCHY_PYTHON $DAEMONARCHY_LIBEXEC/install-views diagnostics"
bind -N "Open remote debugging (approve agents) in a new window" R new-window -n remote-debug "$DAEMONARCHY_PYTHON $DAEMONARCHY_LIBEXEC/install-views remote"
